[changelog]
header = """
# Changelog\n
All notable changes to this project are documented in this file.\n
"""
body = """
{% if version %}\
  ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/d3lm/pr-stats/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
  ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
    - {% if commit.breaking %}**Breaking!** {% endif %}\
      {{ commit.raw_message | split(pat="\n") | first | trim }} \
      ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/d3lm/pr-stats/commit/{{ commit.id }}))\
  {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = ".*", skip = true },
]
protect_breaking_commits = true
sort_commits = "oldest"
