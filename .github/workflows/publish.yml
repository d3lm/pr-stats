name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The macOS notification helper is a Swift app bundle, so it builds on a
  # macOS runner and travels to the publish job as a tarball, because the
  # artifact upload drops the executable bit that the bundle needs.
  notifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - run: bash scripts/build-notifier.sh

      - run: COPYFILE_DISABLE=1 tar -czf pr-stats.app.tgz -C dist pr-stats.app

      - uses: actions/upload-artifact@v7
        with:
          name: pr-stats-app
          path: pr-stats.app.tgz
          if-no-files-found: error

  publish:
    needs: notifier
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"

          version="$(node -p "require('./package.json').version")"

          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - uses: actions/download-artifact@v8
        with:
          name: pr-stats-app
          path: dist

      - name: Unpack the notification helper into dist
        run: |
          tar -xzf dist/pr-stats.app.tgz -C dist
          rm dist/pr-stats.app.tgz
          test -x dist/pr-stats.app/Contents/MacOS/pr-stats-notifier

      # A version that is already on the registry cannot be published
      # again, so a duplicate run for a tag reports that and skips the
      # publish instead of failing on the registry's refusal.
      - name: Check whether this version is already published
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::$name@$version is already on the registry, so this run publishes nothing"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published != 'true'
        run: npm publish
